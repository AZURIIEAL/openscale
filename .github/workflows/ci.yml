name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-plane:
    name: control-plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test ./... -count=1

  worker:
    name: worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      # The unit tests import only pandas-level modules; installing the
      # full Spark/MLflow stack would add minutes for nothing.
      - run: pip install pandas==2.3.3 pyarrow requests pytest
      - run: python -m pytest

  frontend:
    name: frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json predates vitest and npm's resolver crashes when it
      # tries to reconcile the two, so resolve fresh for now. Run
      # `npm install` locally, commit the lockfile, then switch to `npm ci`.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
