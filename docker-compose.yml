name: openscale

services:
  minio:
    image: minio/minio:latest
    container_name: openscale-minio
    ports:
      - "9000:9000" # S3 API
      - "9101:9001" # Web console (9001 is in Windows' Hyper-V reserved port range on this machine)
    environment:
      # Local dev credentials only -- do not reuse these outside a
      # localhost-only container.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: openscale-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/openscale-lake &&
      exit 0
      "

  kafka:
    image: apache/kafka:latest
    container_name: openscale-kafka
    ports:
      - "9092:9092" # broker, reachable from the host at localhost:9092
    environment:
      # Single-node KRaft mode -- no Zookeeper needed. Local dev only.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16-alpine
    container_name: openscale-postgres
    ports:
      - "5432:5432" # offline feature store
    environment:
      # Local dev credentials only.
      POSTGRES_USER: openscale
      POSTGRES_PASSWORD: openscale
      POSTGRES_DB: openscale
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openscale-redis
    ports:
      - "6379:6379" # online feature store + job queue (Redis Streams)
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: openscale-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop; explicit for
      # portability to a Linux host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: openscale-grafana
    ports:
      - "3000:3000"
    environment:
      # Local dev credentials only.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  control-plane:
    build:
      context: ./control-plane
    container_name: openscale-control-plane
    ports:
      - "8080:8080" # HTTP API, called by the frontend at VITE_API_BASE_URL
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: "http://localhost:5173"
      POSTGRES_DSN: "postgres://openscale:openscale@postgres:5432/openscale?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    volumes:
      # Grants access to the host's Docker daemon so internal/docker can
      # inspect sibling containers (openscale-minio, openscale-kafka, ...)
      # for /api/system-health. Read-only: this service only inspects,
      # never starts/stops containers today.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    container_name: openscale-worker
    environment:
      REDIS_ADDR: "redis:6379"
      POSTGRES_DSN: "postgresql://openscale:openscale@postgres:5432/openscale"
      MINIO_ENDPOINT: "http://minio:9000"
      # In local[*] mode there's no separate executor JVM -- this is the
      # *only* heap budget for the whole Spark job, driver + all parallel
      # tasks. 2g OOM'd Train's full-dataset scan+sample+toPandas() at the
      # real 40-month (~140M row) data volume already present in this
      # environment's MinIO volume; 6g (vs. etl-exposure's original
      # hardcoded 8g) leaves headroom for the other 8 compose services on
      # a 16GB Docker allocation.
      SPARK_DRIVER_MEMORY: "6g"
    volumes:
      # rw: downloaded raw parquet lands here, persists across rebuilds and
      # is visible on the host for inspection.
      - ./worker/data:/app/data
      # rw: Silver's per-period quality-report JSON.
      - ./worker/docs:/app/docs
      # rw: MLflow's sqlite tracking db + logged model artifacts.
      - ./worker/ml:/app/ml
      # Cached Maven/Ivy-resolved jars (hadoop-aws + transitive deps) for
      # the Gold/Features/Train Spark sessions -- avoids re-downloading on
      # every image rebuild.
      - ./worker/.ivy2:/root/.ivy2
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  jupyter:
    build:
      context: ./jupyter
    container_name: openscale-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: "openscale-dev"
    volumes:
      # rw: notebook 03 writes real output files.
      - ./notebooks:/home/jovyan/notebooks
    command: start-notebook.py --ServerApp.root_dir=/home/jovyan/notebooks
    restart: unless-stopped

  mlflow:
    # Reuses the worker's own image (mlflow is already in its
    # requirements.txt for the train job's in-process client) instead of a
    # separate Dockerfile -- this service just runs `mlflow server` against
    # the exact same tracking store the worker's train job already writes
    # to, so nothing needs migrating.
    build:
      context: ./worker
    container_name: openscale-mlflow
    entrypoint: ["mlflow"]
    command:
      - server
      - --backend-store-uri
      - sqlite:////app/ml/mlflow/mlflow.db
      - --default-artifact-root
      - /app/ml/mlflow/artifacts
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      # MLflow 3's security middleware sends X-Frame-Options: SAMEORIGIN by
      # default, which would block the ML Workbench screen's iframe (a
      # different origin, :5173 vs :5000). NONE is MLflow's own documented
      # flag for "embed the UI in iframes from different origins" -- fine
      # here since this whole stack is localhost-only, dev-only credentials
      # throughout (see MinIO/Postgres/Grafana above).
      - --x-frame-options
      - "NONE"
    ports:
      - "5000:5000"
    volumes:
      # Same tracking db + artifacts the worker's train job writes to
      # (worker/ml/training/train_fare_model.py's MLFLOW_TRACKING_URI) --
      # shared, not copied, so runs show up here immediately.
      - ./worker/ml:/app/ml
    restart: unless-stopped

volumes:
  # Explicit names, matching the volumes already populated by the original
  # (pre-restructure) "openscale" compose project -- pins these services to
  # that existing data instead of creating fresh empty ones.
  minio-data:
    name: openscale_minio-data
  postgres-data:
    name: openscale_postgres-data
  redis-data:
    name: openscale_redis-data
  grafana-data:
    name: openscale_grafana-data
