services:
  minio:
    image: minio/minio:latest
    container_name: openscale-minio
    ports:
      - "9000:9000" # S3 API
      - "9101:9001" # Web console (9001 is in Windows' Hyper-V reserved port range on this machine)
    environment:
      # Local dev credentials only -- do not reuse these outside a
      # localhost-only container.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: openscale-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/openscale-lake &&
      exit 0
      "

volumes:
  minio-data:
