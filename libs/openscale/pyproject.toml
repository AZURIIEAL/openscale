[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openscale"
version = "0.1.0"
description = "Shared lake, DuckDB and ingest helpers for OpenScale's Python services"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.3"]

[tool.setuptools.packages.find]
include = ["openscale*"]
